<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOVIO — პროდუქტი</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=product-actions-20261005">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js" defer></script>
<script src="store.js?v=readiness-20261008" defer></script>
<script src="supabase-sync.js?v=readiness-20261008" defer></script>
  <script src="product-detail.js?v=prelaunch-20261008-2" defer></script>
</head>

<body class="item-page item-page-ecommerce">

  <header class="item-page-header">
    <a class="wordmark" href="index.html#top">
      <img src="movio-logo-final.svg" alt="MOVIO">
    </a>

    <div class="detail-header-actions">
    <a class="item-header-back" href="index.html#catalog">
      ← კატალოგი
    </a>
    <a class="detail-header-cart" href="cart.html" aria-label="კალათა">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 9.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 7H6"/><circle cx="10" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      <b id="detailCartCount">0</b>
    </a>
    </div>
  </header>

  <main class="item-page-main">

    <article class="item-page-detail" id="productDetail" aria-labelledby="detailTitle" hidden>

      <figure class="item-page-media">
        <img
          class="item-page-image"
          id="detailImage"
          src=""
          alt=""
          hidden
        >

        <div class="item-page-no-photo" id="detailNoPhoto" hidden>
          ფოტო არ არის
        </div>
      </figure>

      <div class="item-page-copy">

        <p class="item-page-index detail-top-line">
          <span class="detail-discount-badge" id="detailDiscountBadge" hidden></span>
          <span class="detail-stock-badge" id="detailStockBadge" hidden>მარაგშია</span>
          <span class="detail-category-label">MOVIO / <span id="detailCategory">პროდუქტი</span></span>
        </p>

        <h1 id="detailTitle">პროდუქტი</h1>

        <div class="detail-pricing">
          <strong id="detailPrice">—</strong>
          <span id="detailOldPriceRow" hidden><del id="detailOldPrice">—</del></span>
        </div>

        <div class="detail-purchase-actions">
          <button class="item-page-add detail-buy" id="detailBuy" type="button">ყიდვა ახლავე</button>
          <button class="item-page-add detail-add" id="detailAdd" type="button">კალათაში დამატება</button>
        </div>
        <p class="detail-cart-message" id="detailCartMessage" role="status" aria-live="polite"></p>

      </div>

        <section class="detail-description-section detail-content-panel" aria-labelledby="descriptionTitle">
        <h2 id="descriptionTitle">პროდუქტის აღწერა</h2>
        <p
          class="item-page-description"
          id="detailDescription">
        </p>
        </section>

        <section class="item-page-facts detail-content-panel" aria-labelledby="featuresTitle">
          <h2 id="featuresTitle">მახასიათებლები</h2>

          <dl>
            <div class="detail-specifications" id="detailSpecifications"></div>

            <div>
              <dt>კატეგორია</dt>
              <dd id="detailCategoryRow">—</dd>
            </div>

            <div>
              <dt>მარაგი</dt>
              <dd id="detailStock">—</dd>
            </div>

            <div id="detailQuantityRow" hidden>
              <dt>რაოდენობა</dt>
              <dd id="detailQuantity">—</dd>
            </div>

          </dl>
        </section>


    </article>

    <section class="detail-related" id="detailRelated" hidden aria-labelledby="relatedTitle">
      <h2 id="relatedTitle">მსგავსი პროდუქტები</h2>
      <div class="detail-related-grid" id="detailRelatedGrid"></div>
      <p class="detail-related-empty" id="detailRelatedEmpty" hidden>ამ კატეგორიაში სხვა პროდუქტები ჯერ არ არის.</p>
    </section>

    <section
      class="item-page-not-found"
      id="productNotFound"
      hidden>

      <p>404</p>
      <h1>პროდუქტი ვერ მოიძებნა</h1>

      <a class="item-page-back" href="index.html#catalog">
        ← კატალოგში დაბრუნება
      </a>

    </section>

  </main>

</body>
</html>
