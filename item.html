<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOVIO — პროდუქტი</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js" defer></script>
<script src="store.js" defer></script>
<script src="supabase-sync.js" defer></script>
  <script src="product-detail.js" defer></script>
</head>

<body class="item-page">

  <header class="item-page-header">
    <a class="wordmark" href="index.html#top">
      <img src="movio-logo-final.svg" alt="MOVIO">
    </a>

    <a class="item-header-back" href="index.html#catalog">
      ← კატალოგი
    </a>
  </header>

  <main class="item-page-main">

    <article class="item-page-detail" id="productDetail">

      <figure class="item-page-media">
        <img
          class="item-page-image"
          id="detailImage"
          src=""
          alt=""
          hidden
        >

        <div class="item-page-no-photo" id="detailNoPhoto" hidden>
          ფოტო არ არის
        </div>
      </figure>

      <div class="item-page-copy">

        <p class="item-page-index">
          MOVIO / <span id="detailCategory">პროდუქტი</span>
        </p>

        <h1 id="detailTitle">პროდუქტი</h1>

        <p
          class="item-page-description"
          id="detailDescription">
        </p>

        <section class="item-page-facts">
          <h2>პროდუქტის ინფორმაცია</h2>

          <dl>

            <div>
              <dt>კატეგორია</dt>
              <dd id="detailCategoryRow">—</dd>
            </div>

            <div>
              <dt>მარაგი</dt>
              <dd id="detailStock">—</dd>
            </div>

            <div>
              <dt>ფასი</dt>
              <dd id="detailPrice">—</dd>
            </div>

            <div id="detailOldPriceRow" hidden>
              <dt>ძველი ფასი</dt>
              <dd id="detailOldPrice">—</dd>
            </div>

            <div id="detailQuantityRow" hidden>
              <dt>რაოდენობა</dt>
              <dd id="detailQuantity">—</dd>
            </div>

          </dl>
        </section>

        <button
          class="item-page-add"
          id="detailAdd"
          type="button">
          <span class="add-label">კალათაში</span>
          <span aria-hidden="true">🛒</span>
        </button>

        <a class="item-page-back" href="index.html#catalog">
          ← კატალოგში დაბრუნება
        </a>

      </div>

    </article>

    <section
      class="item-page-not-found"
      id="productNotFound"
      hidden>

      <p>404</p>
      <h1>პროდუქტი ვერ მოიძებნა</h1>

      <a class="item-page-back" href="index.html#catalog">
        ← კატალოგში დაბრუნება
      </a>

    </section>

  </main>

</body>
</html>
